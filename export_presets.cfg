[preset.0]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="toolchain.lock.json,assets/audio/cc0_m1/*.json,assets/audio/cc0_m1/*.md,assets/audio/cc0_m1/*.txt"
exclude_filter="tests/*,docs/*,tools/*,scripts/*,build/*,demo-evidence/*"
export_path="build/exports/linux/MortalPath.x86_64"
script_export_mode=2

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="toolchain.lock.json,assets/audio/cc0_m1/*.json,assets/audio/cc0_m1/*.md,assets/audio/cc0_m1/*.txt"
exclude_filter="tests/*,docs/*,tools/*,scripts/*,build/*,demo-evidence/*"
export_path="build/exports/macos/MortalPath.zip"
script_export_mode=2

[preset.1.options]
export/architecture="universal"
application/bundle_identifier="org.mortalpath.game"
application/short_version="0.1.0"
application/version="0.1.0"
codesign/codesign=3
codesign/identity="-"
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
