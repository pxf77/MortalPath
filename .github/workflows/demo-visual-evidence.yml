name: Demo visual evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "tools/**"
      - "assets/**"
      - "project.godot"
      - "toolchain.lock.json"
      - ".github/workflows/demo-visual-evidence.yml"

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: .tools
          key: godot-linux-editor-${{ hashFiles('toolchain.lock.json') }}

      - name: Install exact official editor
        run: python3 tools/godot_toolchain.py install --github

      - name: Install virtual display, encoder and CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth ffmpeg libgl1-mesa-dri libglx-mesa0 mesa-utils \
            fontconfig fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh | sed -n '1,3p'

      - name: Import project and build script class cache
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          bash scripts/check-godot-log.sh /tmp/godot-import.log
          test -s .godot/global_script_class_cache.cfg

      - name: Run graphical demo and record evidence
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p demo-evidence

          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset \
            > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          sleep 2

          godot \
            --path . \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --position 0,0 \
            --script res://tests/demo_visual_capture.gd \
            > /tmp/godot-visual-demo.log 2>&1 &
          GODOT_PID=$!

          sleep 1
          ffmpeg -y \
            -f x11grab \
            -video_size 1280x720 \
            -framerate 20 \
            -i :99.0 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            demo-evidence/mortalpath-demo-v0.1.mp4 \
            > /tmp/ffmpeg-record.log 2>&1 &
          FFMPEG_PID=$!

          set +e
          wait "$GODOT_PID"
          GODOT_STATUS=$?
          set -e

          sleep 1
          kill -INT "$FFMPEG_PID" 2>/dev/null || true
          wait "$FFMPEG_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          cat /tmp/godot-visual-demo.log
          if [ "$GODOT_STATUS" -ne 0 ]; then
            cat /tmp/xvfb.log || true
            cat /tmp/ffmpeg-record.log || true
            exit "$GODOT_STATUS"
          fi

          bash scripts/check-godot-log.sh /tmp/godot-visual-demo.log

          test -s demo-evidence/mortalpath-demo-v0.1.mp4
          test "$(find demo-evidence -maxdepth 1 -name '*.png' | wc -l)" -eq 7

      - name: Build GIF and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y \
            -i demo-evidence/mortalpath-demo-v0.1.mp4 \
            -vf "fps=10,scale=960:-1:flags=lanczos,palettegen=stats_mode=diff" \
            demo-evidence/palette.png
          ffmpeg -y \
            -i demo-evidence/mortalpath-demo-v0.1.mp4 \
            -i demo-evidence/palette.png \
            -lavfi "fps=10,scale=960:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=3" \
            demo-evidence/mortalpath-demo-v0.1.gif

          ffmpeg -y \
            -framerate 1 \
            -pattern_type glob \
            -i 'demo-evidence/[0-9][0-9]-*.png' \
            -vf "scale=640:-1,tile=2x4:padding=8:margin=8" \
            -frames:v 1 \
            demo-evidence/contact-sheet.png

          test -s demo-evidence/mortalpath-demo-v0.1.gif
          test -s demo-evidence/contact-sheet.png
          du -h demo-evidence/*

      - name: Validate graphical feedback and record three normal-input completions with audio
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p demo-evidence/normal-input
          timeout 180s xvfb-run -a godot --path . --display-driver x11 \
            --rendering-method gl_compatibility --fixed-fps 60 \
            --script res://tests/combat_feedback_runner.gd 2>&1 | tee demo-evidence/feedback.log
          bash scripts/check-godot-log.sh demo-evidence/feedback.log
          timeout 300s xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --display-driver x11 --rendering-method gl_compatibility \
            --fixed-fps 60 --write-movie demo-evidence/normal-input/runs.avi \
            --script res://tests/demo_input_runner.gd -- \
            --capture --output=res://demo-evidence/normal-input \
            2>&1 | tee demo-evidence/normal-input/godot.log
          bash scripts/check-godot-log.sh demo-evidence/normal-input/godot.log
          ffmpeg -y -i demo-evidence/normal-input/runs.avi \
            -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -movflags +faststart demo-evidence/normal-input/runs.mp4
          test -s demo-evidence/normal-input/input-runs.json

      - name: Upload visual demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mortalpath-demo-visual-evidence
          path: demo-evidence/
          if-no-files-found: error
          retention-days: 14
