name: Godot checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  headless-rules:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eq "SCRIPT ERROR|Failed to load script" /tmp/godot-import.log; then
            echo "Godot import reported script errors."
            exit 1
          fi

      - name: Check every GDScript
        shell: bash
        run: |
          set -euo pipefail
          find src tests -type f -name '*.gd' -print | sort > /tmp/gdscript-files.txt
          while IFS= read -r script; do
            echo "Checking $script"
            godot --headless --disable-render-loop --path . --check-only --script "res://$script"
          done < /tmp/gdscript-files.txt

      - name: Smoke test main scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --disable-render-loop --path . --quit-after 30 2>&1 | tee /tmp/godot-smoke.log
          if grep -Eq "SCRIPT ERROR|Failed to load script" /tmp/godot-smoke.log; then
            echo "Main scene smoke test reported script errors."
            exit 1
          fi

      - name: Run rule tests
        run: godot --headless --disable-render-loop --path . --script res://tests/test_runner.gd

      - name: Run demo flow test
        run: godot --headless --disable-render-loop --path . --script res://tests/demo_scene_runner.gd
