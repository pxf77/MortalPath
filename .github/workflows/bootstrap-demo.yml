name: Bootstrap initial game demo

on:
  push:
    branches:
      - feat/initial-game-demo
    paths:
      - ".demo_migration/**"
      - ".github/workflows/bootstrap-demo.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4
        with:
          ref: feat/initial-game-demo
          fetch-depth: 0

      - name: Reconstruct demo files
        shell: bash
        run: |
          set -euo pipefail
          cat .demo_migration/part* > "$RUNNER_TEMP/demo.b64"
          base64 --decode "$RUNNER_TEMP/demo.b64" > "$RUNNER_TEMP/demo.tar.gz"
          echo "edd60307ff78858eb61948ae26f3aa875e72e53a9d4f24c0fd60e816010de3dd  $RUNNER_TEMP/demo.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/demo.tar.gz" -C .

      - name: Verify payload
        shell: bash
        run: |
          set -euo pipefail
          test -s src/main/main.gd
          test -s src/main/main.tscn
          test -s src/actors/player/player_controller.gd
          test -s src/actors/enemies/training_enemy.gd
          test -s src/world/formation_anchor.gd
          test -s src/world/escape_portal.gd
          test -s tests/demo_scene_runner.gd
          python - <<'PY'
          from pathlib import Path
          required = [
              "src/main/main.gd",
              "src/main/main.tscn",
              "src/actors/player/player_controller.gd",
              "src/actors/enemies/training_enemy.gd",
              "src/world/formation_anchor.gd",
              "src/world/escape_portal.gd",
              "tests/demo_scene_runner.gd",
          ]
          for path in required:
              assert Path(path).is_file(), path
          print("demo payload verified")
          PY

      - name: Commit demo payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .demo_migration
          git restore --source=HEAD -- .github/workflows/bootstrap-demo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement initial Qinglan Valley game demo"
          git push origin HEAD:feat/initial-game-demo
