name: Export working tree snapshot

on:
  push:
    branches:
      - feat/qinglan-artpack-v0.2-runtime
    paths:
      - ".github/workflows/export-working-tree.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pack repository source
        run: |
          tar \
            --exclude=.git \
            --exclude=.godot \
            --exclude=.tools \
            --exclude=build \
            -czf /tmp/mortalpath-working-tree.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mortalpath-working-tree
          path: /tmp/mortalpath-working-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
