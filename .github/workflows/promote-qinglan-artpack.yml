name: Promote Qinglan Art Pack runtime

on:
  push:
    branches:
      - feat/qinglan-artpack-v0.2-runtime
    paths:
      - ".github/workflows/promote-qinglan-artpack.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify the validated Art runtime
        shell: bash
        env:
          ART_RUNTIME_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-6040-8230-bd60-9cf7ce02c8c6/raw?se=2026-09-03T04%3A49%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=c8c6b4cb-6cfb-55bb-9118-94acf550f87a&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T22%3A23%3A34Z&ske=2026-09-03T22%3A23%3A34Z&sks=b&skv=2026-02-06&sig=w2uFeLZItP6SPJHys2sWgysmX7SVn2Qe3aXUPpdc%2BmE%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ART_RUNTIME_URL" -o /tmp/art-runtime.zip
          echo "c0395e6aaa6161412874f22c0456932711d63f24636949fdee1eff7199f1119f  /tmp/art-runtime.zip" | sha256sum --check -
          rm -rf /tmp/qinglan-art-runtime
          mkdir -p /tmp/qinglan-art-runtime
          unzip -q /tmp/art-runtime.zip -d /tmp/qinglan-art-runtime

      - name: Apply game integration and promote runtime GLBs
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .migration/qinglan-integration.patch.gz.b64 | base64 --decode >/dev/null 2>&1 || true
          base64 --decode .migration/qinglan-integration.patch.gz.b64 | gzip -dc | patch -p1

          pack_root="assets/artpacks/qinglan_v0_2"
          rm -rf "$pack_root/runtime"
          mkdir -p "$pack_root/runtime"
          cp -R /tmp/qinglan-art-runtime/runtime/. "$pack_root/runtime/"
          rm -f "$pack_root/runtime/props/prop_pipeline_marker.glb"

          mkdir -p "$pack_root"
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('/tmp/qinglan-art-runtime/reports/asset-catalog.json')
          target = Path('assets/artpacks/qinglan_v0_2/asset-catalog.json')
          catalog = json.loads(source.read_text(encoding='utf-8'))
          catalog['assets'] = [item for item in catalog['assets'] if item.get('id') != 'prop_pipeline_marker']
          catalog['asset_count'] = len(catalog['assets'])
          catalog['source_commit'] = '3d7d37b64efdedde2edd8509743dd2db4631a943'
          target.write_text(json.dumps(catalog, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          cat > "$pack_root/art-pack.lock.json" <<'JSON'
          {
            "schema_version": 1,
            "version": "artpack-v0.2.0-qinglan-valley",
            "source_repository": "pxf77/MortalPath-Art",
            "source_asset_commit": "3d7d37b64efded2edd8509743dd2db4631a943",
            "runtime_snapshot_commit": "4f28bf5f58700052922fefb765f1c8339983c85a",
            "artifact_run_id": 33705193100,
            "artifact_id": 9874998683,
            "artifact_sha256": "c0395e6aaa6161412874f22c0456932711d63f24636949fdee1eff7199f1119f",
            "asset_count": 13,
            "engine": "Godot 4.7.2",
            "status": "released_runtime_promoted"
          }
          JSON

          cat > "$pack_root/README.md" <<'MD'
          # Qinglan Valley Runtime Art Pack v0.2

          This directory contains the 13 runtime GLB assets promoted from the verified `MortalPath-Art` pipeline output.

          - Version: `artpack-v0.2.0-qinglan-valley`
          - Art merge: `3d7d37b64efdedde2edd8509743dd2db4631a943`
          - Runtime snapshot: `4f28bf5f58700052922fefb765f1c8339983c85a`
          - Godot baseline: `4.7.2 stable`

          Editable DCC sources remain in the private art repository. The game repository contains only promoted runtime assets, the filtered catalog and the immutable lock record.
          MD

          test "$(find "$pack_root/runtime" -type f -name '*.glb' | wc -l)" -eq 13
          python -m json.tool "$pack_root/art-pack.lock.json" >/dev/null
          python -m json.tool "$pack_root/asset-catalog.json" >/dev/null

      - name: Commit promoted runtime and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .migration
          rm -f .github/workflows/export-working-tree.yml
          rm -f .github/workflows/promote-qinglan-artpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Qinglan Valley Art Pack v0.2 runtime"
          git push origin HEAD:feat/qinglan-artpack-v0.2-runtime
