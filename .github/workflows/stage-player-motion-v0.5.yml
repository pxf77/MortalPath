name: Stage player motion v0.5 runtime

on:
  push:
    branches:
      - feat/player-motion-runtime-v0.5
    paths:
      - ".github/workflows/stage-player-motion-v0.5.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/player-motion-runtime-v0.5

      - name: Download fixed verified Art Pack
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://sdmntprcentralus.oaiusercontent.com/files/00000000-97c0-81f5-82c8-b57233f0c138/raw?se=2026-09-04T03%3A30%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=32a5c915-c989-5180-b056-ff794ebde3ae&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A09%3A19Z&ske=2026-09-05T03%3A09%3A19Z&sks=b&skv=2026-02-06&sig=OCejNeT9cRxZ23rZK0FWeYWLh62AKzLw0%2FLrWiMz5E4%3D' \
            --output /tmp/artifact.zip
          mkdir -p /tmp/outer /tmp/inner
          unzip -q /tmp/artifact.zip -d /tmp/outer
          snapshot="$(find /tmp/outer -maxdepth 1 -name 'mortalpath-artpack-snapshot-*.zip' -print -quit)"
          test -n "$snapshot"
          echo 'f9e10b08a81055ff3df86bab9da9baa0267a82f1f453348510a806c3add58d8d  '"$snapshot" | sha256sum -c -
          unzip -q "$snapshot" -d /tmp/inner

      - name: Promote locked runtime and manifest
        shell: bash
        run: |
          set -euo pipefail
          target='assets/artpacks/player_motion_v0_5'
          mkdir -p "$target/runtime/characters" "$target/manifests/characters"
          cp /tmp/inner/runtime/characters/chr_player_qi_refining_refined_v0_5.glb \
            "$target/runtime/characters/chr_player_qi_refining_refined_v0_5.glb"
          cp /tmp/inner/manifests/characters/chr_player_qi_refining_refined_v0_5.json \
            "$target/manifests/characters/chr_player_qi_refining_refined_v0_5.json"
          echo 'e4e1f6e5f0ca9e52f77ad69278151a8548ffe13b4ab5f5fc01cf2cd3aecb9ce9  '"$target/runtime/characters/chr_player_qi_refining_refined_v0_5.glb" | sha256sum -c -
          echo 'e0673c204bded54099d101a97e379dfe7281abb815499ce5ae357253bcefd5e6  '"$target/manifests/characters/chr_player_qi_refining_refined_v0_5.json" | sha256sum -c -
          test "$(stat -c %s "$target/runtime/characters/chr_player_qi_refining_refined_v0_5.glb")" = 901736
          test "$(stat -c %s "$target/manifests/characters/chr_player_qi_refining_refined_v0_5.json")" = 9444

      - name: Commit promoted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/artpacks/player_motion_v0_5/runtime assets/artpacks/player_motion_v0_5/manifests
          if git diff --cached --quiet; then
            echo 'Runtime already staged.'
            exit 0
          fi
          git commit -m 'build: stage verified player motion v0.5 runtime [skip ci]'
          git push origin HEAD:feat/player-motion-runtime-v0.5
