name: Stage player polish runtime once

on:
  push:
    branches:
      - feat/player-polish-v0.4-runtime
    paths:
      - ".github/workflows/stage-player-polish-v0.4.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/player-polish-v0.4-runtime
          fetch-depth: 0

      - name: Download verified Art runtime artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-7dac-81fd-ac06-992e5d91a65c/raw?se=2026-09-03T08%3A04%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=24c9a2f7-6960-5e8b-9a58-82f367e93a4c&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T06%3A16%3A46Z&ske=2026-09-04T06%3A16%3A46Z&sks=b&skv=2026-02-06&sig=NErb5ip1casPyEPAVNA6lYJuopDPN0JHAHSi6FmLNxU%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o "$RUNNER_TEMP/art-runtime.zip"
          rm -rf "$RUNNER_TEMP/art-runtime"
          mkdir -p "$RUNNER_TEMP/art-runtime"
          unzip -q "$RUNNER_TEMP/art-runtime.zip" -d "$RUNNER_TEMP/art-runtime"
          source_file="$(find "$RUNNER_TEMP/art-runtime" -type f -path '*/runtime/characters/chr_player_qi_refining_polished_v0_4.glb' -print -quit)"
          test -n "$source_file"
          mkdir -p assets/artpacks/player_polish_v0_4/runtime/characters
          cp "$source_file" assets/artpacks/player_polish_v0_4/runtime/characters/
          echo "b45a22623cf45e2346bb93fc90243fe7f4f87b450486e135866d2f57a4a98303  assets/artpacks/player_polish_v0_4/runtime/characters/chr_player_qi_refining_polished_v0_4.glb" | sha256sum --check

      - name: Commit verified binary and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/stage-player-polish-v0.4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/artpacks/player_polish_v0_4/runtime/characters/chr_player_qi_refining_polished_v0_4.glb .github/workflows/stage-player-polish-v0.4.yml
          git commit -m "feat: stage verified player polish runtime GLB"
          git push origin HEAD:feat/player-polish-v0.4-runtime
