    <rect x="690" y="286" width="95" height="58"/>
    <path d="M675 288 L738 246 L800 288 Z"/>
    <rect x="820" y="300" width="110" height="58"/>
    <path d="M805 302 L875 258 L946 302 Z"/>
    <rect x="1370" y="286" width="92" height="56"/>
    <path d="M1354 288 L1416 252 L1478 288 Z"/>
  </g>
