<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAE3D5"/>
      <stop offset="1" stop-color="#D8D0C0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8AEA6"/>
      <stop offset="0.55" stop-color="#747B74"/>
      <stop offset="1" stop-color="#405348"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303833"/>
      <stop offset="1" stop-color="#1C2320"/>
    </linearGradient>
    <radialGradient id="jadeAura">
      <stop offset="0" stop-color="#8BC1AE" stop-opacity="0.7"/>
      <stop offset="0.65" stop-color="#4F8778" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4F8778" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldAura">
      <stop offset="0" stop-color="#D8C08A" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#B08A4B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#B08A4B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soulAura">
      <stop offset="0" stop-color="#B5C7D1" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#6C8390" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6C8390" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font-family: Georgia, 'Noto Serif CJK SC', serif; fill: #1C2320; font-weight: 700; }
      .body { font-family: Arial, 'Noto Sans CJK SC', sans-serif; fill: #28302C; }
      .light { font-family: Arial, 'Noto Sans CJK SC', sans-serif; fill: #EAE3D5; }
      .muted { fill: #74766F; }
      .line { stroke: #756047; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect x="16" y="16" width="1568" height="868" rx="8" fill="none" stroke="#756047" stroke-width="3"/>
  <rect x="28" y="28" width="1544" height="844" rx="5" fill="none" stroke="#B08A4B" stroke-width="1" opacity="0.8"/>

  <text x="58" y="75" font-size="42" class="title">MortalPath 美术方向 v0.1</text>
  <text x="60" y="112" font-size="23" class="body">凡尘山水 · 写意半写实</text>
  <line x1="55" y1="132" x2="530" y2="132" class="line"/>
  <text x="60" y="170" font-size="20" class="body">真实山川与功能建筑为基础</text>
  <text x="60" y="204" font-size="20" class="body">低饱和自然环境，仙法局部强调</text>
  <text x="60" y="238" font-size="20" class="body">境界越高：动作越少，控制越稳定</text>
  <text x="60" y="272" font-size="20" class="body">战斗可读性高于粒子数量</text>

  <rect x="560" y="48" width="970" height="340" rx="6" fill="url(#sky)"/>
  <path d="M560 235 L690 120 L780 220 L910 88 L1020 210 L1160 105 L1280 220 L1410 115 L1530 210 L1530 388 L560 388 Z" fill="#313B37" opacity="0.8"/>
  <path d="M560 280 L680 188 L805 285 L930 166 L1055 276 L1190 176 L1320 286 L1445 184 L1530 248 L1530 388 L560 388 Z" fill="#405348" opacity="0.92"/>
  <path d="M560 325 C720 290 845 330 980 302 C1110 275 1240 310 1370 294 C1440 286 1490 300 1530 318 L1530 388 L560 388 Z" fill="#59675F"/>
  <path d="M1045 388 C1090 342 1110 318 1160 300 C1210 282 1250 275 1290 245 C1255 303 1230 331 1190 350 C1150 370 1112 380 1088 388 Z" fill="#788B87" opacity="0.9"/>
