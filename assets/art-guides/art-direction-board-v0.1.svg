    <rect x="716" y="306" width="12" height="16"/><rect x="750" y="306" width="12" height="16"/>
    <rect x="850" y="319" width="13" height="17"/><rect x="895" y="319" width="13" height="17"/>
    <rect x="1397" y="305" width="12" height="16"/><rect x="1430" y="305" width="12" height="16"/>
  </g>
  <text x="590" y="370" font-size="17" class="light">可信山川、生活痕迹与区域建筑语言</text>

  <text x="60" y="335" font-size="24" class="title">基础色板</text>
  <g transform="translate(60,350)">
    <circle cx="20" cy="20" r="18" fill="#1C2320"/><circle cx="70" cy="20" r="18" fill="#405348"/>
    <circle cx="120" cy="20" r="18" fill="#74766F"/><circle cx="170" cy="20" r="18" fill="#756047"/>
    <circle cx="220" cy="20" r="18" fill="#D8D0C0" stroke="#74766F"/><circle cx="270" cy="20" r="18" fill="#9F4338"/>
    <circle cx="320" cy="20" r="18" fill="#4F8778"/><circle cx="370" cy="20" r="18" fill="#B08A4B"/>
  </g>

  <line x1="50" y1="420" x2="1550" y2="420" class="line"/>
  <text x="58" y="458" font-size="28" class="title">境界视觉递进：控制方式与战场权重</text>
  <text x="650" y="458" font-size="18" class="body">筑基 → 结丹：从成熟御器到本命法宝与多线控制</text>
  <text x="1110" y="458" font-size="18" class="body">结丹 → 元婴：从战场体系到神识与空间控制权</text>

  <g transform="translate(48,485)">
    <rect width="480" height="350" rx="8" fill="url(#panel)"/>
    <text x="24" y="45" font-size="31" class="light">筑基修士</text>
    <text x="24" y="75" font-size="17" class="light" opacity="0.8">稳定护体 · 一攻一守 · 局部压制</text>
    <ellipse cx="275" cy="218" rx="115" ry="100" fill="url(#jadeAura)"/>
    <circle cx="274" cy="145" r="20" fill="#C9C3B8"/>
    <path d="M255 170 L293 170 L319 274 L229 274 Z" fill="#405348" stroke="#9AA69F" stroke-width="2"/>
    <path d="M255 182 L205 240 M293 182 L341 230" stroke="#C9C3B8" stroke-width="8" stroke-linecap="round"/>
    <path d="M250 274 L236 320 M298 274 L312 320" stroke="#222A26" stroke-width="12"/>
    <path d="M135 176 L228 205" stroke="#8BC1AE" stroke-width="5" filter="url(#softGlow)"/>
    <path d="M130 173 L153 170 L140 184 Z" fill="#D8D0C0"/>
    <path d="M332 188 L409 147" stroke="#8BC1AE" stroke-width="5" filter="url(#softGlow)"/>
    <path d="M405 143 L425 140 L412 154 Z" fill="#D8D0C0"/>
    <g fill="#6E806F" opacity="0.8"><ellipse cx="165" cy="277" rx="8" ry="3"/><ellipse cx="188" cy="295" rx="7" ry="3"/><ellipse cx="370" cy="286" rx="9" ry="3"/></g>
    <text x="24" y="314" font-size="17" class="light">• 动作仍完整，但更短促、沉稳</text>
    <text x="24" y="338" font-size="17" class="light">• 常规控制 1～2 件法器，影响数米范围</text>
  </g>

  <g transform="translate(560,485)">
    <rect width="480" height="350" rx="8" fill="url(#panel)"/>
    <text x="24" y="45" font-size="31" class="light">结丹修士</text>
    <text x="24" y="75" font-size="17" class="light" opacity="0.8">本命法宝 · 多线控制 · 战场中心</text>
    <ellipse cx="260" cy="218" rx="175" ry="135" fill="url(#goldAura)"/>
    <ellipse cx="260" cy="286" rx="132" ry="35" fill="none" stroke="#B08A4B" stroke-width="3"/>
    <ellipse cx="260" cy="286" rx="93" ry="23" fill="none" stroke="#D0B36D" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M145 286 L190 270 L235 289 L280 267 L330 289 L380 270" fill="none" stroke="#B08A4B" stroke-width="2"/>
    <circle cx="260" cy="132" r="20" fill="#D0CAC0"/>
    <path d="M238 156 L282 156 L319 275 L201 275 Z" fill="#283633" stroke="#B08A4B" stroke-width="2"/>
    <path d="M240 177 L196 223 M281 177 L324 214" stroke="#D0CAC0" stroke-width="7" stroke-linecap="round"/>
    <circle cx="260" cy="105" r="29" fill="none" stroke="#D8C08A" stroke-width="5" filter="url(#softGlow)"/>
    <path d="M260 72 L272 105 L260 138 L248 105 Z" fill="#B08A4B"/>
    <g stroke="#D8C08A" stroke-width="4" filter="url(#softGlow)">
      <path d="M180 156 L91 119"/><path d="M205 128 L145 76"/><path d="M317 128 L380 75"/><path d="M340 159 L432 126"/><path d="M330 212 L430 230"/>
    </g>
    <text x="24" y="314" font-size="17" class="light">• 一件本命法宝统合攻击、护主与封锁</text>
    <text x="24" y="338" font-size="17" class="light">• 3～6 条攻击线控制完整战斗区域</text>
  </g>

  <g transform="translate(1072,485)">
    <rect width="480" height="350" rx="8" fill="url(#panel)"/>
    <text x="24" y="45" font-size="31" class="light">元婴老祖</text>
    <text x="24" y="75" font-size="17" class="light" opacity="0.8">神识压迫 · 瞬移 · 控制权夺取</text>
    <ellipse cx="270" cy="215" rx="186" ry="142" fill="url(#soulAura)"/>
    <path d="M70 145 C150 115 180 165 260 135 C340 105 375 155 445 125" fill="none" stroke="#9AAEB8" stroke-width="2" opacity="0.55"/>
    <path d="M58 245 C150 215 190 265 270 235 C350 205 390 255 454 226" fill="none" stroke="#9AAEB8" stroke-width="2" opacity="0.45"/>
    <circle cx="270" cy="111" r="33" fill="none" stroke="#AFC3CD" stroke-width="3" opacity="0.5"/>
    <path d="M238 143 L302 143 L337 274 L203 274 Z" fill="none" stroke="#AFC3CD" stroke-width="3" opacity="0.32"/>
    <circle cx="270" cy="143" r="19" fill="#D7D2C8"/>
    <path d="M249 166 L291 166 L319 279 L221 279 Z" fill="#30383A" stroke="#8FA2AB" stroke-width="2"/>
    <path d="M250 187 L221 219 M290 187 L318 210" stroke="#D7D2C8" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(385,170)">
      <circle r="44" fill="none" stroke="#AFC3CD" stroke-width="4" filter="url(#softGlow)"/>
      <circle r="24" fill="none" stroke="#B08A4B" stroke-width="3"/>
      <path d="M0 -38 L12 -12 L38 0 L12 12 L0 38 L-12 12 L-38 0 L-12 -12 Z" fill="#756047" stroke="#D8C08C" stroke-width="2"/>
    </g>
    <path d="M65 200 L160 200" stroke="#D8C08A" stroke-width="5"/>
    <path d="M158 193 L181 200 L158 207 Z" fill="#D8C08A"/>
    <circle cx="184" cy="200" r="14" fill="none" stroke="#9AAEB8" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="24" y="314" font-size="17" class="light">• 动作更少，一件法宝即可压制结丹体系</text>
    <text x="24" y="338" font-size="17" class="light">• 以停滞、偏转、折射和寂静表现力量</text>
  </g>

  <text x="52" y="868" font-size="16" class="body">正式规范以 docs/art-direction/ 为准；该板用于色彩、构图、轮廓与境界递进评审。</text>
</svg>
